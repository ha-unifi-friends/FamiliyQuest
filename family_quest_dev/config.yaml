name: "Family Quest Dev"
version: "1.1.1-dev.14"
stage: experimental
slug: family_quest_dev
description: "DEV – Organize your family life with gamification – learning, chores, planner and games"
url: https://github.com/ha-unifi-friends/FamiliyQuest
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:school
panel_title: "Family Quest Dev"
panel_admin: false
ports:
  8099/tcp: 8097
ports_description:
  8099/tcp: "Direct access for tablets in the home network (only with the option direct_access)"
map:
  - share:rw
  - homeassistant_config:rw
  - media:rw
options:
  log_level: info
  direct_access: true
schema:
  log_level: list(debug|info|warning|error)
  direct_access: bool
