# Deutsch B1 – language course (own content, Family Quest, CC0)
id: sprache-de-b1
titel: "German B1 – Intermediate"
fach: deutsch
stufe: "B1"
sprache: de
quellsprache: en
version: 1
quelle: Family Quest (eigene Inhalte, CC0)
icon: "🇩🇪"
beschreibung: "Express opinions and feelings, talk about work, media and the environment, and build longer sentences."
beschreibung_i18n:   # the description in the language of the app (shown in the course list)
  de: "Meinungen und Gefühle ausdrücken, über Arbeit, Medien und Umwelt sprechen und längere Sätze bauen."
  fr: "Exprimer des opinions et des sentiments, parler du travail, des médias et de l'environnement, et construire des phrases plus longues."
  it: "Esprimere opinioni e sentimenti, parlare di lavoro, media e ambiente e costruire frasi più lunghe."
  es: "Expresar opiniones y sentimientos, hablar del trabajo, los medios y el medio ambiente y formar frases más largas."
  nl: "Meningen en gevoelens uiten, praten over werk, media en milieu en langere zinnen maken."
  pl: "Wyrażanie opinii i uczuć, rozmowy o pracy, mediach i środowisku oraz budowanie dłuższych zdań."
  pt: "Expressar opiniões e sentimentos, falar sobre trabalho, mídia e meio ambiente e formar frases mais longas."
  sv: "Uttrycka åsikter och känslor, prata om arbete, medier och miljö och bygga längre meningar."
pfad: true
standard: false
selbst: true
einheiten:
  - id: work-school
    titel: Work and school
    icon: "💼"
    uebungen: [auswahl, eintippen, paare, hoeren, karteikarte]
    karten:
      - {en: the job application, de: die Bewerbung, emoji: "📄"}
      - {en: the colleague (female), de: die Kollegin}
      - {en: the colleague (male), de: der Kollege}
      - {en: the boss (male), de: der Chef, emoji: "👔"}
      - {en: the meeting, de: die Sitzung, auch: [das Meeting, die Besprechung]}
      - {en: the apprenticeship, de: die Lehre, auch: [die Ausbildung]}
      - {en: the exam, de: die Prüfung, emoji: "📝"}
      - {en: the grade / the mark, de: die Note}
      - {en: the salary, de: der Lohn, auch: [das Gehalt], emoji: "💰"}
      - {en: to apply (for a job), de: sich bewerben}
      - {en: to earn, de: verdienen}
      - {en: experienced, de: erfahren}
  - id: opinions
    titel: Giving your opinion
    icon: "🗣️"
    uebungen: [auswahl, eintippen, hoeren, karteikarte]
    karten:
      - {en: "In my opinion …", de: "Meiner Meinung nach …"}
      - {en: "I think that's a good idea.", de: Ich finde das eine gute Idee.}
      - {en: I agree with you., de: Ich bin deiner Meinung.}
      - {en: "I don't agree.", de: Da bin ich anderer Meinung.}
      - {en: "That's true.", de: Das stimmt.}
      - {en: "On the one hand … on the other hand …", de: "Einerseits … andererseits …"}
      - {en: "I'm not sure.", de: Ich bin mir nicht sicher.}
      - {en: "What do you think?", de: "Was meinst du?"}
      - {en: That depends., de: Das kommt darauf an.}
      - {en: "I'm convinced that …", de: "Ich bin überzeugt, dass …"}
  - id: environment
    titel: Environment and nature
    icon: "🌍"
    uebungen: [auswahl, eintippen, paare, hoeren, karteikarte]
    karten:
      - {en: the environment, de: die Umwelt, emoji: "🌍"}
      - {en: the climate, de: das Klima}
      - {en: the waste / the rubbish, de: der Abfall, auch: [der Müll], emoji: "🗑️"}
      - {en: the energy, de: die Energie, emoji: "⚡"}
      - {en: the forest, de: der Wald, emoji: "🌲"}
      - {en: the air, de: die Luft}
      - {en: the pollution, de: die Verschmutzung, emoji: "🏭"}
      - {en: to recycle, de: recyceln, emoji: "♻️"}
      - {en: to protect, de: schützen}
      - {en: to save (energy), de: sparen}
      - {en: sustainable, de: nachhaltig}
      - {en: renewable, de: erneuerbar}
  - id: media
    titel: Media and technology
    icon: "📱"
    uebungen: [auswahl, eintippen, paare, hoeren, karteikarte]
    karten:
      - {en: the newspaper, de: die Zeitung, emoji: "📰"}
      - {en: the news, de: die Nachrichten}
      - {en: the mobile phone, de: das Handy, emoji: "📱"}
      - {en: the screen, de: der Bildschirm, emoji: "🖥️"}
      - {en: the message, de: die Nachricht, emoji: "💬"}
      - {en: the advertisement, de: die Werbung}
      - {en: the password, de: das Passwort, emoji: "🔑"}
      - {en: the article, de: der Artikel}
      - {en: to download, de: herunterladen, emoji: "⬇️"}
      - {en: to share, de: teilen}
      - {en: to search for, de: suchen}
      - {en: online, de: online}
  - id: feelings
    titel: Feelings
    icon: "😊"
    uebungen: [auswahl, eintippen, paare, hoeren, karteikarte]
    karten:
      - {en: happy, de: glücklich, emoji: "😊"}
      - {en: sad, de: traurig, emoji: "😢"}
      - {en: angry, de: wütend, emoji: "😠"}
      - {en: nervous, de: nervös, emoji: "😬"}
      - {en: proud, de: stolz}
      - {en: disappointed, de: enttäuscht, emoji: "😞"}
      - {en: surprised, de: überrascht, emoji: "😮"}
      - {en: bored, de: gelangweilt, emoji: "🥱"}
      - {en: the fear, de: die Angst, emoji: "😨"}
      - {en: to look forward to, de: sich freuen auf}
      - {en: to be annoyed about, de: sich ärgern über}
      - {en: "I'm worried.", de: Ich mache mir Sorgen.}
  - id: idioms
    titel: Idioms and sayings
    icon: "🐷"
    uebungen: [auswahl, eintippen, hoeren, karteikarte]
    karten:
      - {en: to be lucky (lit. to have a pig), de: Schwein haben, emoji: "🐷"}
      - {en: I keep my fingers crossed for you., de: Ich drücke dir die Daumen., emoji: "🤞"}
      - {en: "That's not my cup of tea.", de: Das ist nicht mein Ding.}
      - {en: "That's all Greek to me.", de: Ich verstehe nur Bahnhof.}
      - {en: to be very tired (lit. to be dead tired), de: todmüde sein}
      - {en: "There's a catch somewhere.", de: Da ist ein Haken dran.}
      - {en: "Break a leg! / Good luck!", de: "Hals- und Beinbruch!"}
      - {en: to be in a bad mood, de: schlechte Laune haben}
      - {en: "That's the last straw!", de: "Das ist der Gipfel!"}
      - {en: to kill two birds with one stone, de: zwei Fliegen mit einer Klappe schlagen}
  - id: praeteritum
    titel: "Präteritum – telling stories"
    icon: "✍️"
    uebungen: [lueckentext, auswahl]
    karten:
      - {frage: "Präteritum – sein (ich)", antwort: war, satz: "Gestern ___ ich sehr müde.", optionen: [war, waren, bin, wäre]}
      - {frage: "Präteritum – haben (wir)", antwort: hatten, satz: "Früher ___ wir einen Hund.", optionen: [hatte, hatten, haben, hätten]}
      - {frage: "Präteritum – gehen (er)", antwort: ging, satz: "Er ___ jeden Tag zu Fuss zur Arbeit.", optionen: [ging, gang, gehte, geht]}
      - {frage: "Präteritum – kommen (sie, they)", antwort: kamen, satz: "Die Gäste ___ erst um zehn Uhr.", optionen: [kamen, kommten, kam, kommen]}
      - {frage: "Präteritum – sagen (sie, she)", antwort: sagte, satz: "Sie ___ kein Wort.", optionen: [sagte, sag, sagten, sug]}
      - {frage: "Präteritum – können (ich)", antwort: konnte, satz: "Als Kind ___ ich nicht schwimmen.", optionen: [konnte, kann, könnte, konnten]}
      - {frage: "Präteritum – fahren (wir)", antwort: fuhren, satz: "Im Sommer ___ wir ans Meer.", optionen: [fuhren, fahrten, fuhr, fahren]}
      - {frage: "Präteritum – finden (er)", antwort: fand, satz: "Er ___ den Schlüssel unter dem Sofa.", optionen: [fand, findete, fund, fanden]}
      - {frage: "Präteritum – müssen (du)", antwort: musstest, satz: "Warum ___ du so früh gehen?", optionen: [musstest, musste, müsstest, musst]}
      - {frage: "Präteritum – wohnen (ich)", antwort: wohnte, satz: "Damals ___ ich in Bern.", optionen: [wohnte, wohne, wohnten, wahn]}
  - id: konjunktiv-2
    titel: "Konjunktiv II – würde, hätte, wäre"
    icon: "💭"
    uebungen: [lueckentext, auswahl]
    karten:
      - {frage: "wish – würde (ich)", antwort: würde, satz: "Ich ___ gern mehr reisen.", optionen: [würde, wurde, wird, werde]}
      - {frage: "wish – hätte (ich)", antwort: hätte, satz: "Wenn ich Zeit ___, käme ich mit.", optionen: [hätte, hatte, habe, wäre]}
      - {frage: "wish – wäre (es)", antwort: wäre, satz: "Es ___ schön, wenn du kommst.", optionen: [wäre, war, ist, hätte]}
      - {frage: "polite – könnten (Sie)", antwort: Könnten, satz: "___ Sie mir bitte helfen?", optionen: [Könnten, Konnten, Können, Kannst]}
      - {frage: "advice – würde (ich, an deiner Stelle)", antwort: würde, satz: "An deiner Stelle ___ ich zum Arzt gehen.", optionen: [würde, wurde, werde, wäre]}
      - {frage: "wish – wäre (ich)", antwort: wäre, satz: "Ich ___ jetzt lieber am Strand.", optionen: [wäre, war, bin, hätte]}
      - {frage: "polite – hätte (ich)", antwort: hätte, satz: "Ich ___ gern ein Glas Wasser.", optionen: [hätte, hatte, habe, würde]}
      - {frage: "wish – würdest (du)", antwort: würdest, satz: "Was ___ du mit einer Million machen?", optionen: [würdest, wurdest, wirst, würde]}
      - {frage: "advice – solltest (du)", antwort: solltest, satz: "Du ___ mehr schlafen.", optionen: [solltest, sollst, solltet, sollte]}
      - {frage: "wish – hätten (wir)", antwort: hätten, satz: "Wenn wir ein Auto ___, wäre alles einfacher.", optionen: [hätten, hatten, haben, wären]}
  - id: weil-dass
    titel: "weil and dass – verb at the end"
    icon: "🔗"
    uebungen: [lueckentext, auswahl]
    karten:
      - {frage: "weil – word order (bin)", antwort: krank bin, satz: "Ich bleibe zu Hause, weil ich ___.", optionen: [krank bin, bin krank, krank sein, bin ich krank]}
      - {frage: "dass – word order (kommt)", antwort: morgen kommt, satz: "Ich glaube, dass sie ___.", optionen: [morgen kommt, kommt morgen, kommen morgen, morgen kommen]}
      - {frage: "weil or dass? (reason)", antwort: weil, satz: "Er lernt viel, ___ er die Prüfung bestehen will.", optionen: [weil, dass, denn, aber]}
      - {frage: "weil or dass? (I know …)", antwort: dass, satz: "Ich weiss, ___ du recht hast.", optionen: [weil, dass, wenn, ob]}
      - {frage: "weil – word order (regnet)", antwort: es regnet, satz: "Wir gehen nicht raus, weil ___.", optionen: [es regnet, regnet es, es regnen, regnet]}
      - {frage: "dass – word order (hat)", antwort: keine Zeit hat, satz: "Er sagt, dass er ___.", optionen: [keine Zeit hat, hat keine Zeit, keine Zeit haben, hat er keine Zeit]}
      - {frage: "weil – modal verb at the end", antwort: arbeiten muss, satz: "Sie kommt nicht, weil sie ___.", optionen: [arbeiten muss, muss arbeiten, arbeiten müssen, muss sie arbeiten]}
      - {frage: "denn or weil? (normal word order)", antwort: denn, satz: "Ich nehme einen Schirm, ___ es regnet bald.", optionen: [denn, weil, dass, ob]}
      - {frage: "dass – Perfekt word order", antwort: gewonnen haben, satz: "Ich freue mich, dass wir ___.", optionen: [gewonnen haben, haben gewonnen, gewinnen haben, haben wir gewonnen]}
      - {frage: "weil – separable verb", antwort: früh aufsteht, satz: "Er ist müde, weil er immer so ___.", optionen: [früh aufsteht, steht früh auf, früh steht auf, aufsteht früh]}
