# Spanisch A1 – Sprachkurs (eigene Inhalte, Family Quest, CC0)
id: sprache-es-a1
titel: "Spanisch A1 – Einstieg"
fach: spanisch
stufe: "A1"
sprache: es
quellsprache: de
version: 1
quelle: Family Quest (eigene Inhalte, CC0)
icon: "🇪🇸"
beschreibung: "Erste Schritte auf Spanisch: begrüssen, zählen, Familie, Essen, Farben und die Verben ser, estar und tener."
beschreibung_i18n:   # the description in the language of the app (shown in the course list)
  en: "First steps in Spanish: greeting, counting, family, food, colours and the verbs ser, estar and tener."
  fr: "Premiers pas en espagnol : saluer, compter, la famille, la nourriture, les couleurs et les verbes ser, estar et tener."
  it: "Primi passi in spagnolo: salutare, contare, famiglia, cibo, colori e i verbi ser, estar e tener."
  nl: "Eerste stappen in het Spaans: begroeten, tellen, familie, eten, kleuren en de werkwoorden ser, estar en tener."
  pl: "Pierwsze kroki w hiszpańskim: powitania, liczenie, rodzina, jedzenie, kolory i czasowniki ser, estar i tener."
  pt: "Primeiros passos em espanhol: cumprimentar, contar, família, comida, cores e os verbos ser, estar e tener."
  sv: "Första stegen på spanska: hälsa, räkna, familj, mat, färger och verben ser, estar och tener."
pfad: true
standard: false
selbst: true
einheiten:
  - id: saludos
    titel: "Hallo und erste Sätze"
    icon: "👋"
    uebungen: [auswahl, eintippen, hoeren, karteikarte]
    karten:
      - {de: "Hallo!", es: "¡Hola!", auch: ["Hola!"], emoji: "👋"}
      - {de: "Guten Morgen!", es: "¡Buenos días!", auch: ["Buenos dias!"], emoji: "🌅"}
      - {de: "Guten Tag! (nachmittags)", es: "¡Buenas tardes!", auch: ["Buenas tardes!"], emoji: "☀️"}
      - {de: "Gute Nacht!", es: "¡Buenas noches!", auch: ["Buenas noches!"], emoji: "🌙"}
      - {de: "Tschüss!", es: "¡Adiós!", auch: ["Adios!"]}
      - {de: "Bis später!", es: "¡Hasta luego!", auch: ["Hasta luego!"]}
      - {de: "Wie geht's?", es: "¿Qué tal?", auch: ["Que tal?"]}
      - {de: "Gut, danke.", es: "Bien, gracias."}
      - {de: "Wie heisst du?", es: "¿Cómo te llamas?", auch: ["Como te llamas?"]}
      - {de: "Ich heisse Leo.", es: "Me llamo Leo."}
      - {de: "Ich komme aus der Schweiz.", es: "Soy de Suiza.", emoji: "🇨🇭"}
      - {de: "Ich verstehe nicht.", es: "No entiendo."}
  - id: numeros
    titel: "Zahlen"
    icon: "🔢"
    uebungen: [auswahl, eintippen, paare, hoeren, karteikarte]
    karten:
      - {de: "eins", es: "uno", emoji: "1️⃣"}
      - {de: "zwei", es: "dos", emoji: "2️⃣"}
      - {de: "drei", es: "tres", emoji: "3️⃣"}
      - {de: "vier", es: "cuatro", emoji: "4️⃣"}
      - {de: "fünf", es: "cinco", emoji: "5️⃣"}
      - {de: "sechs", es: "seis", emoji: "6️⃣"}
      - {de: "sieben", es: "siete", emoji: "7️⃣"}
      - {de: "acht", es: "ocho", emoji: "8️⃣"}
      - {de: "neun", es: "nueve", emoji: "9️⃣"}
      - {de: "zehn", es: "diez", emoji: "🔟"}
      - {de: "zwanzig", es: "veinte"}
      - {de: "hundert", es: "cien", emoji: "💯"}
  - id: familia
    titel: "Die Familie"
    icon: "👪"
    uebungen: [auswahl, eintippen, paare, hoeren, karteikarte]
    karten:
      - {de: "die Mutter", es: "la madre", emoji: "👩"}
      - {de: "der Vater", es: "el padre", emoji: "👨"}
      - {de: "die Schwester", es: "la hermana", emoji: "👧"}
      - {de: "der Bruder", es: "el hermano", emoji: "👦"}
      - {de: "die Eltern", es: "los padres"}
      - {de: "die Grossmutter", es: "la abuela", emoji: "👵"}
      - {de: "der Grossvater", es: "el abuelo", emoji: "👴"}
      - {de: "der Sohn", es: "el hijo"}
      - {de: "die Tochter", es: "la hija"}
      - {de: "der Onkel", es: "el tío", auch: ["el tio"]}
      - {de: "die Tante", es: "la tía", auch: ["la tia"]}
      - {de: "der Cousin", es: "el primo"}
  - id: comida
    titel: "Essen und Trinken"
    icon: "🍎"
    uebungen: [auswahl, eintippen, paare, hoeren, karteikarte]
    karten:
      - {de: "das Brot", es: "el pan", emoji: "🍞"}
      - {de: "das Wasser", es: "el agua", emoji: "💧"}
      - {de: "die Milch", es: "la leche", emoji: "🥛"}
      - {de: "der Käse", es: "el queso", emoji: "🧀"}
      - {de: "der Apfel", es: "la manzana", emoji: "🍎"}
      - {de: "das Ei", es: "el huevo", emoji: "🥚"}
      - {de: "der Reis", es: "el arroz", emoji: "🍚"}
      - {de: "der Saft", es: "el zumo", emoji: "🧃"}
      - {de: "das Fleisch", es: "la carne", emoji: "🥩"}
      - {de: "der Fisch", es: "el pescado", emoji: "🐟"}
      - {de: "das Obst", es: "la fruta", emoji: "🍇"}
      - {de: "das Eis (Glace)", es: "el helado", emoji: "🍦"}
  - id: colores
    titel: "Farben"
    icon: "🎨"
    uebungen: [auswahl, eintippen, paare, hoeren, karteikarte]
    karten:
      - {de: "rot", es: "rojo", emoji: "🔴"}
      - {de: "blau", es: "azul", emoji: "🔵"}
      - {de: "grün", es: "verde", emoji: "🟢"}
      - {de: "gelb", es: "amarillo", emoji: "🟡"}
      - {de: "schwarz", es: "negro", emoji: "⚫"}
      - {de: "weiss", es: "blanco", emoji: "⚪"}
      - {de: "orange", es: "naranja", emoji: "🟠"}
      - {de: "rosa", es: "rosa", emoji: "🌸"}
      - {de: "grau", es: "gris"}
      - {de: "braun", es: "marrón", auch: ["marron"], emoji: "🟤"}
      - {de: "violett", es: "morado", emoji: "🟣"}
  - id: dias
    titel: "Tage und Zeit"
    icon: "📅"
    uebungen: [auswahl, eintippen, paare, hoeren, karteikarte]
    karten:
      - {de: "der Montag", es: "el lunes"}
      - {de: "der Dienstag", es: "el martes"}
      - {de: "der Mittwoch", es: "el miércoles", auch: ["el miercoles"]}
      - {de: "der Donnerstag", es: "el jueves"}
      - {de: "der Freitag", es: "el viernes"}
      - {de: "der Samstag", es: "el sábado", auch: ["el sabado"]}
      - {de: "der Sonntag", es: "el domingo"}
      - {de: "heute", es: "hoy"}
      - {de: "morgen", es: "mañana", auch: ["manana"]}
      - {de: "gestern", es: "ayer"}
      - {de: "die Woche", es: "la semana", emoji: "🗓️"}
      - {de: "die Stunde", es: "la hora", emoji: "🕐"}
  - id: escuela
    titel: "Schule und Arbeit"
    icon: "🏫"
    uebungen: [auswahl, eintippen, paare, hoeren, karteikarte]
    karten:
      - {de: "die Schule", es: "el colegio", auch: ["la escuela"], emoji: "🏫"}
      - {de: "der Lehrer", es: "el profesor", emoji: "👨‍🏫"}
      - {de: "die Lehrerin", es: "la profesora", emoji: "👩‍🏫"}
      - {de: "das Buch", es: "el libro", emoji: "📕"}
      - {de: "das Heft", es: "el cuaderno", emoji: "📓"}
      - {de: "der Bleistift", es: "el lápiz", auch: ["el lapiz"], emoji: "✏️"}
      - {de: "der Rucksack", es: "la mochila", emoji: "🎒"}
      - {de: "der Computer", es: "el ordenador", emoji: "💻"}
      - {de: "die Arbeit", es: "el trabajo"}
      - {de: "das Büro", es: "la oficina", emoji: "🏢"}
      - {de: "der Arzt", es: "el médico", auch: ["el medico"], emoji: "👨‍⚕️"}
      - {de: "die Ärztin", es: "la médica", auch: ["la medica"], emoji: "👩‍⚕️"}
  - id: ser
    titel: "ser – sein"
    icon: "✍️"
    uebungen: [lueckentext, auswahl]
    karten:
      - {frage: "ser – yo", antwort: "soy", satz: "Yo ___ de Suiza.", optionen: ["soy", "eres", "es", "somos", "sois", "son"]}
      - {frage: "ser – tú", antwort: "eres", satz: "¿Tú ___ Marta?", optionen: ["soy", "eres", "es", "somos", "sois", "son"]}
      - {frage: "ser – él", antwort: "es", satz: "Él ___ mi hermano.", optionen: ["soy", "eres", "es", "somos", "sois", "son"]}
      - {frage: "ser – nosotros", antwort: "somos", satz: "Nosotros ___ amigos.", optionen: ["soy", "eres", "es", "somos", "sois", "son"]}
      - {frage: "ser – vosotros", antwort: "sois", satz: "¿Vosotros ___ de Madrid?", optionen: ["soy", "eres", "es", "somos", "sois", "son"]}
      - {frage: "ser – ellas", antwort: "son", satz: "Ellas ___ profesoras.", optionen: ["soy", "eres", "es", "somos", "sois", "son"]}
      - {frage: "ser – la casa", antwort: "es", satz: "La casa ___ grande.", optionen: ["soy", "eres", "es", "somos", "sois", "son"]}
      - {frage: "ser – tú y yo", antwort: "somos", satz: "Tú y yo ___ hermanos.", optionen: ["soy", "eres", "es", "somos", "sois", "son"]}
  - id: estar-tener
    titel: "estar und tener"
    icon: "✍️"
    uebungen: [lueckentext, auswahl]
    karten:
      - {frage: "estar – yo", antwort: "estoy", satz: "Yo ___ en casa.", optionen: ["estoy", "estás", "está", "estamos", "estáis", "están"]}
      - {frage: "estar – tú", antwort: "estás", auch: ["estas"], satz: "¿Cómo ___?", optionen: ["estoy", "estás", "está", "estamos", "estáis", "están"]}
      - {frage: "estar – Madrid", antwort: "está", auch: ["esta"], satz: "Madrid ___ en España.", optionen: ["estoy", "estás", "está", "estamos", "estáis", "están"]}
      - {frage: "estar – nosotros", antwort: "estamos", satz: "Nosotros ___ en el colegio.", optionen: ["estoy", "estás", "está", "estamos", "estáis", "están"]}
      - {frage: "estar – los libros", antwort: "están", auch: ["estan"], satz: "Los libros ___ en la mesa.", optionen: ["estoy", "estás", "está", "estamos", "estáis", "están"]}
      - {frage: "tener – yo", antwort: "tengo", satz: "Yo ___ dos hermanos.", optionen: ["tengo", "tienes", "tiene", "tenemos", "tenéis", "tienen"]}
      - {frage: "tener – tú", antwort: "tienes", satz: "¿Cuántos años ___?", optionen: ["tengo", "tienes", "tiene", "tenemos", "tenéis", "tienen"]}
      - {frage: "tener – mi abuela", antwort: "tiene", satz: "Mi abuela ___ un gato.", optionen: ["tengo", "tienes", "tiene", "tenemos", "tenéis", "tienen"]}
      - {frage: "tener – nosotros", antwort: "tenemos", satz: "Nosotros ___ hambre.", optionen: ["tengo", "tienes", "tiene", "tenemos", "tenéis", "tienen"]}
      - {frage: "tener – vosotros", antwort: "tenéis", auch: ["teneis"], satz: "¿Vosotros ___ perro?", optionen: ["tengo", "tienes", "tiene", "tenemos", "tenéis", "tienen"]}
      - {frage: "tener – ellos", antwort: "tienen", satz: "Ellos ___ una casa grande.", optionen: ["tengo", "tienes", "tiene", "tenemos", "tenéis", "tienen"]}
