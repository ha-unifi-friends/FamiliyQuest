      - {frage: "Frage – did", antwort: "Did", satz: "___ you watch the match yesterday?", optionen: ["Did", "Do", "Does", "Was"]}
      - {frage: "Verneinung – didn't", antwort: "didn't", satz: "I ___ go to school on Sunday.", optionen: ["didn't", "don't", "wasn't", "doesn't"]}
