      - {frage: "aller – nous (futur proche)", antwort: allons, satz: "Nous ___ visiter Paris.", optionen: [vais, vas, va, allons, allez, vont]}
      - {frage: "aller – vous (futur proche)", antwort: allez, satz: "Vous ___ prendre le train ?", optionen: [vais, vas, va, allons, allez, vont]}
      - {frage: "aller – ils (futur proche)", antwort: vont, satz: "Ils ___ jouer au foot.", optionen: [vais, vas, va, allons, allez, vont]}
      - {frage: "aller – elles (futur proche)", antwort: vont, satz: "Elles ___ faire du ski.", optionen: [vais, vas, va, allons, allez, vont]}
