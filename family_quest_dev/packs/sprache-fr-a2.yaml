  - id: passe-compose
    titel: "Passé composé"
    icon: "✍️"
    uebungen: [lueckentext, auswahl]
    karten:
      - {frage: "manger – j' (passé composé)", antwort: ai mangé, auch: [ai mange], satz: "Hier, j'___ une pizza.", optionen: [ai mangé, suis mangé, mange, ai manger]}
      - {frage: "aller – je (passé composé)", antwort: suis allé, auch: [suis allée, suis alle], satz: "Samedi, je ___ au marché.", optionen: [suis allé, ai allé, vais, suis aller]}
      - {frage: "finir – tu (passé composé)", antwort: as fini, satz: "Tu ___ tes devoirs ?", optionen: [as fini, es fini, finis, as finir]}
      - {frage: "voir – il (passé composé)", antwort: a vu, satz: "Il ___ un film au cinéma.", optionen: [a vu, est vu, voit, a voir]}
      - {frage: "partir – elle (passé composé)", antwort: est partie, satz: "Elle ___ en vacances.", optionen: [est partie, a parti, est parti, part]}
      - {frage: "faire – nous (passé composé)", antwort: avons fait, satz: "Nous ___ une randonnée.", optionen: [avons fait, sommes faits, faisons, avons faire]}
      - {frage: "venir – vous (passé composé)", antwort: êtes venus, auch: [etes venus, êtes venu, êtes venue, êtes venues], satz: "Vous ___ en train ?", optionen: [êtes venus, avez venu, venez, êtes venir]}
      - {frage: "acheter – ils (passé composé)", antwort: ont acheté, auch: [ont achete], satz: "Ils ___ du pain.", optionen: [ont acheté, sont achetés, achètent, ont acheter]}
      - {frage: "prendre – j' (passé composé)", antwort: ai pris, satz: "J'___ le bus ce matin.", optionen: [ai pris, suis pris, prends, ai prendu]}
      - {frage: "arriver – elles (passé composé)", antwort: sont arrivées, auch: [sont arrivees], satz: "Elles ___ à la gare.", optionen: [sont arrivées, ont arrivé, arrivent, sont arrivé]}
  - id: futur-proche
