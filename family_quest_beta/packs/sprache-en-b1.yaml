  - id: present-perfect
    titel: "Present Perfect"
    icon: "✅"
    uebungen: [lueckentext, auswahl]
    karten:
      - {frage: "I – schon gemacht", antwort: "have", satz: "I ___ already finished my homework.", optionen: ["have", "has", "had", "am"]}
      - {frage: "she – noch nie", antwort: "has", satz: "She ___ never been to Australia.", optionen: ["have", "has", "had", "is"]}
      - {frage: "Partizip – see", antwort: "seen", satz: "Have you ever ___ a whale?", optionen: ["seen", "saw", "see", "seeing"]}
      - {frage: "Partizip – write", antwort: "written", satz: "He has ___ three emails today.", optionen: ["written", "wrote", "writed", "write"]}
      - {frage: "Partizip – lose", antwort: "lost", satz: "Oh no! I've ___ my keys.", optionen: ["lost", "losed", "lose", "losing"]}
      - {frage: "seit (Zeitpunkt)", antwort: "since", satz: "We have lived here ___ 2019.", optionen: ["since", "for", "ago", "from"]}
      - {frage: "seit (Zeitdauer)", antwort: "for", satz: "They have known each other ___ ten years.", optionen: ["since", "for", "ago", "during"]}
      - {frage: "noch nicht", antwort: "yet", satz: "Has the film started ___?", optionen: ["yet", "already", "still", "ever"]}
      - {frage: "je / jemals", antwort: "ever", satz: "Have you ___ eaten sushi?", optionen: ["ever", "never", "yet", "already"]}
      - {frage: "gerade eben", antwort: "just", satz: "I have ___ arrived at the station.", optionen: ["just", "yet", "ever", "since"]}
  - id: conditionals
    titel: "If-Sätze (Bedingungen)"
    icon: "🔀"
    uebungen: [lueckentext, auswahl]
    karten:
      - {frage: "Typ 1 – Wenn es regnet …", antwort: "rains", satz: "If it ___ tomorrow, we will stay at home.", optionen: ["rains", "will rain", "rained", "would rain"]}
      - {frage: "Typ 1 – Folge", antwort: "will", satz: "If you study hard, you ___ pass the exam.", optionen: ["will", "would", "are", "did"]}
      - {frage: "Typ 1 – Folge (verneint)", antwort: "won't", satz: "If we don't hurry, we ___ catch the bus.", optionen: ["won't", "wouldn't", "don't", "didn't"]}
      - {frage: "Typ 2 – Wenn ich … hätte", antwort: "had", satz: "If I ___ more money, I would travel the world.", optionen: ["had", "have", "will have", "would have"]}
      - {frage: "Typ 2 – Folge", antwort: "would", satz: "If she lived closer, she ___ visit us more often.", optionen: ["would", "will", "does", "did"]}
      - {frage: "Typ 2 – an deiner Stelle", antwort: "were", satz: "If I ___ you, I would ask the teacher.", optionen: ["were", "am", "will be", "be"]}
      - {frage: "Typ 2 – könnte", antwort: "could", satz: "If I could fly, I ___ go anywhere.", optionen: ["could", "can", "will", "did"]}
      - {frage: "Typ 0 – Tatsache", antwort: "boils", satz: "If you heat water to 100 degrees, it ___.", optionen: ["boils", "boiled", "would boil", "boiling"]}
      - {frage: "unless – ausser wenn", antwort: "unless", satz: "You won't get better ___ you rest.", optionen: ["unless", "if", "when", "because"]}
  - id: phrasal-verbs
    titel: "Phrasal Verbs"
    icon: "🧩"
    uebungen: [auswahl, eintippen, hoeren, karteikarte]
    karten:
      - {de: "aufgeben", en: "to give up", auch: ["give up"]}
      - {de: "herausfinden", en: "to find out", auch: ["find out"]}
      - {de: "sich um jemanden kümmern", en: "to look after someone", auch: ["look after someone", "to look after", "look after", "to take care of someone", "take care of someone"]}
      - {de: "sich auf etwas freuen", en: "to look forward to something", auch: ["look forward to something", "to look forward to", "look forward to"]}
      - {de: "aufwachsen", en: "to grow up", auch: ["grow up"]}
      - {de: "absagen", en: "to call off", auch: ["call off", "to cancel", "cancel"]}
      - {de: "sich mit jemandem gut verstehen", en: "to get on with someone", auch: ["get on with someone", "to get along with someone", "get along with someone", "to get on with", "get on with"]}
      - {de: "etwas nachschlagen", en: "to look something up", auch: ["look something up", "to look up", "look up"]}
      - {de: "anziehen (Kleidung)", en: "to put on", auch: ["put on"]}
      - {de: "aufräumen", en: "to tidy up", auch: ["tidy up", "to clean up", "clean up"]}
      - {de: "ausgehen (zu Ende gehen)", en: "to run out", auch: ["run out", "to run out of", "run out of"]}
