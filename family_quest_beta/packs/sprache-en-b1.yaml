  - id: opinions
    titel: "Meinungen äussern"
    icon: "🗣️"
    uebungen: [auswahl, eintippen, hoeren, karteikarte]
    karten:
      - {de: "Meiner Meinung nach …", en: "In my opinion …", auch: ["In my opinion", "In my view …", "In my view"]}
      - {de: "Ich finde, dass …", en: "I think that …", auch: ["I think that", "I think …", "I think"]}
      - {de: "Da bin ich ganz deiner Meinung.", en: "I totally agree with you.", auch: ["I completely agree with you.", "I fully agree with you.", "I totally agree."]}
      - {de: "Da bin ich nicht sicher.", en: "I'm not so sure about that.", auch: ["I'm not sure about that.", "I am not so sure about that.", "I am not sure about that."]}
      - {de: "Das sehe ich anders.", en: "I see it differently.", auch: ["I see things differently.", "I don't see it that way."]}
      - {de: "Einerseits … andererseits …", en: "On the one hand … on the other hand …", auch: ["On the one hand, on the other hand", "on the one hand … on the other hand"]}
      - {de: "Das ist ein guter Punkt.", en: "That's a good point.", auch: ["That is a good point."]}
      - {de: "Was hältst du davon?", en: "What do you think about it?", auch: ["What do you think of it?", "What do you think?"]}
      - {de: "Es kommt darauf an.", en: "It depends.", auch: ["That depends."]}
      - {de: "Ehrlich gesagt …", en: "To be honest …", auch: ["To be honest", "Honestly …", "Honestly"]}
