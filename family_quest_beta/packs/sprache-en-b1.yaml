      - {de: "die Bewerbung", en: "the application", auch: ["application", "the job application", "job application"], emoji: "📄"}
      - {de: "das Vorstellungsgespräch", en: "the job interview", auch: ["job interview", "the interview", "interview"], emoji: "🤝"}
      - {de: "der Lebenslauf", en: "the CV", auch: ["CV", "the résumé", "résumé", "the resume", "resume"], emoji: "📃"}
      - {de: "die Erfahrung", en: "the experience", auch: ["experience"]}
      - {de: "der Kollege / die Kollegin", en: "the colleague", auch: ["colleague"], emoji: "👥"}
      - {de: "der Chef / die Chefin", en: "the boss", auch: ["boss", "the manager", "manager"], emoji: "👔"}
      - {de: "das Gehalt", en: "the salary", auch: ["salary", "the pay", "pay"], emoji: "💶"}
      - {de: "die Prüfung", en: "the exam", auch: ["exam", "the examination", "examination"], emoji: "📝"}
      - {de: "die Note", en: "the mark", auch: ["mark", "the grade", "grade"]}
      - {de: "die Frist", en: "the deadline", auch: ["deadline"], emoji: "⏳"}
