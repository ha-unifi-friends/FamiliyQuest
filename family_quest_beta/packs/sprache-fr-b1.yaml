      - {frage: "Relativpronomen – parler de", antwort: dont, satz: "C'est le film ___ je t'ai parlé.", optionen: [qui, que, où, dont]}
      - {frage: "Relativpronomen – Subjekt (Sache)", antwort: qui, satz: "Le bus ___ part à huit heures est plein.", optionen: [qui, que, où, dont]}
      - {frage: "Relativpronomen – Zeit", antwort: où, auch: [ou], satz: "Le jour ___ je suis né, il neigeait.", optionen: [qui, que, où, dont]}
      - {frage: "Relativpronomen – Objekt (Person)", antwort: que, satz: "La prof ___ nous aimons part à la retraite.", optionen: [qui, que, où, dont]}
      - {frage: "Relativpronomen – avoir besoin de", antwort: dont, satz: "Voici l'outil ___ tu as besoin.", optionen: [qui, que, où, dont]}
