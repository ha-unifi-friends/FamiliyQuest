      - {frage: "jouer – nous (Gewohnheit)", antwort: jouions, satz: "Chaque été, nous ___ dans le jardin.", optionen: [jouions, avons joué]}
      - {frage: "rencontrer – j' (einmaliges Ereignis)", antwort: ai rencontré, auch: [ai rencontre], satz: "Hier, j'___ mon ancien prof.", optionen: [ai rencontré, rencontrais]}
      - {frage: "avoir – elle (Zustand)", antwort: avait, satz: "Elle ___ peur du noir quand elle était petite.", optionen: [avait, a eu]}
      - {frage: "commencer – il (plötzlich)", antwort: a commencé, auch: [a commence], satz: "Nous marchions quand il ___ à pleuvoir.", optionen: [a commencé, commençait]}
      - {frage: "habiter – ils (früher, Dauer)", antwort: habitaient, satz: "Avant, ils ___ à Genève.", optionen: [habitaient, ont habité]}
      - {frage: "tomber – tu (einmaliges Ereignis)", antwort: es tombé, auch: [es tombée, es tombe], satz: "Tu ___ de vélo samedi ?", optionen: [es tombé, tombais]}
      - {frage: "regarder – je (Hintergrund)", antwort: regardais, satz: "Je ___ la télé quand tu es arrivé.", optionen: [regardais, ai regardé]}
      - {frage: "finir – le film (Abschluss)", antwort: a fini, satz: "Le film ___ à minuit.", optionen: [a fini, finissait]}
