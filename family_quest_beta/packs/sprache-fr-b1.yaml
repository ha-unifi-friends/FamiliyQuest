    titel: "Conditionnel – würde, könnte"
    icon: "✍️"
    uebungen: [lueckentext, auswahl]
    karten:
      - {frage: "vouloir – je (conditionnel)", antwort: voudrais, satz: "Je ___ un café, s'il vous plaît.", optionen: [voudrais, veux, voudrai, voulais]}
      - {frage: "pouvoir – tu (conditionnel)", antwort: pourrais, satz: "Tu ___ m'aider ?", optionen: [pourrais, peux, pourras, pouvais]}
      - {frage: "aimer – j' (conditionnel)", antwort: aimerais, satz: "J'___ vivre à la mer.", optionen: [aimerais, aime, aimerai, aimais]}
      - {frage: "devoir – vous (conditionnel)", antwort: devriez, satz: "Vous ___ dormir plus.", optionen: [devriez, devez, devrez, deviez]}
      - {frage: "être – ce (conditionnel)", antwort: serait, satz: "Ce ___ génial !", optionen: [serait, est, sera, était]}
