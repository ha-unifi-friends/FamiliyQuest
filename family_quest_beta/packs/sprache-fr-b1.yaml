      - {frage: "faire – ils (conditionnel)", antwort: feraient, satz: "Avec plus de temps, ils ___ du sport.", optionen: [feraient, font, feront, faisaient]}
      - {frage: "aller – elle (conditionnel)", antwort: irait, satz: "Si elle pouvait, elle ___ au Canada.", optionen: [irait, va, ira, allait]}
      - {frage: "savoir – tu (conditionnel)", antwort: saurais, satz: "Tu ___ où est la poste ?", optionen: [saurais, sais, sauras, savais]}
