name: "Family Quest Beta"
version: "1.2.1-beta.3"
stage: experimental
slug: family_quest_beta
description: "BETA – Organize your family life with gamification – learning, chores, planner and games"
url: https://github.com/ha-unifi-friends/FamiliyQuest
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:school
panel_title: "Family Quest Beta"
panel_admin: false
# Home Assistant backups while the app runs: before the copy the app pauses its writes and checkpoints its database
# (app/familyquest/hotbackup.py, at most 2 minutes), afterwards the writes go on
backup: hot
backup_pre: python3 /app/familyquest/hotbackup.py pre
backup_post: python3 /app/familyquest/hotbackup.py post
ports:
  8099/tcp: 8098
ports_description:
  8099/tcp: "Direct access for tablets in the home network (only with the option direct_access)"
map:
  - share:rw
  - homeassistant_config:rw
  - media:rw
options:
  log_level: info
  direct_access: true
schema:
  log_level: list(debug|info|warning|error)
  direct_access: bool
