# Geografie Kanton Thurgau – neun Stationen von leicht bis schwierig (Teil von NMG), jede direkt wählbar.
# Fakten bitte vor dem Freigeben durch ein Elternteil prüfen. Die Karte zum Antippen folgt in Etappe 5;
# bis dahin wird mit Drag & Drop (Gemeinde → Bezirk) und Auswahl gelernt.
id: geo-tg
titel: Geografie Kanton Thurgau
titel_i18n: {de: "Geografie Kanton Thurgau", en: "Geography of the canton of Thurgau", fr: "Géographie du canton de Thurgovie", it: "Geografia del Canton Turgovia", es: "Geografía del cantón de Turgovia", nl: "Aardrijkskunde kanton Thurgau", pl: "Geografia kantonu Turgowia", pt: "Geografia do cantão de Turgóvia", sv: "Geografi i kantonen Thurgau"}
fach: nmg
stufe: 5. Klasse
stufe_i18n: {de: "5. Klasse", en: "Year 5", fr: "5e année", it: "5ª classe", es: "5.º curso", nl: "leerjaar 5", pl: "klasa 5", pt: "5º ano", sv: "årskurs 5"}
version: 2
quelle: Family Quest (CC0) – Bezirkszuteilung gemäss Gebietsreform 2011, bitte prüfen
beschreibung: "Der Kanton Thurgau (Schweiz): Bezirke, Nachbarn, Gewässer, Schlösser und Gemeinden – auf Deutsch."
beschreibung_i18n: {de: "Der Kanton Thurgau (Schweiz): Bezirke, Nachbarn, Gewässer, Schlösser und Gemeinden – auf Deutsch.", en: "The canton of Thurgau (Switzerland): districts, neighbours, lakes and rivers, castles and municipalities – in German.", fr: "Le canton de Thurgovie (Suisse) : districts, voisins, lacs et rivières, châteaux et communes – en allemand.", it: "Il Canton Turgovia (Svizzera): distretti, vicini, acque, castelli e comuni – in tedesco.", es: "El cantón de Turgovia (Suiza): distritos, vecinos, aguas, castillos y municipios – en alemán.", nl: "Het kanton Thurgau (Zwitserland): districten, buren, wateren, kastelen en gemeenten – in het Duits.", pl: "Kanton Turgowia (Szwajcaria): okręgi, sąsiedzi, wody, zamki i gminy – po niemiecku.", pt: "O cantão de Turgóvia (Suíça): distritos, vizinhos, águas, castelos e municípios – em alemão.", sv: "Kantonen Thurgau (Schweiz): distrikt, grannar, sjöar och vattendrag, slott och kommuner – på tyska."}
optional: true        # German content only: not installed by default – Parent area › Learning packs › More packs
sprachen: [de]
einheiten:
  - id: bezirke
    titel: "1 · Die fünf Bezirke"
    icon: "🗺️"
    uebungen: [auswahl, karteikarte]
    karten:
      - {frage: "Wie viele Bezirke hat der Kanton Thurgau?", antwort: "5", optionen: ["3", "8", "12"]}
      - {frage: "In welchem Bezirk liegt der Kantonshauptort Frauenfeld?", antwort: Bezirk Frauenfeld, optionen: [Bezirk Weinfelden, Bezirk Arbon, Bezirk Kreuzlingen]}
      - {frage: "Welcher Bezirk liegt ganz im Osten am Bodensee?", antwort: Bezirk Arbon, optionen: [Bezirk Frauenfeld, Bezirk Münchwilen, Bezirk Weinfelden]}
      - {frage: "Welcher Bezirk grenzt an die deutsche Stadt Konstanz?", antwort: Bezirk Kreuzlingen, optionen: [Bezirk Arbon, Bezirk Münchwilen, Bezirk Frauenfeld]}
      - {frage: "Welcher Bezirk liegt im Süden, im Hinterthurgau?", antwort: Bezirk Münchwilen, optionen: [Bezirk Kreuzlingen, Bezirk Arbon, Bezirk Weinfelden]}
      - {frage: "Welcher Bezirk liegt in der Mitte des Kantons?", antwort: Bezirk Weinfelden, optionen: [Bezirk Arbon, Bezirk Kreuzlingen, Bezirk Münchwilen]}
      - {frage: "Welcher Bezirk ist der grösste und liegt im Westen?", antwort: Bezirk Frauenfeld, optionen: [Bezirk Arbon, Bezirk Kreuzlingen, Bezirk Weinfelden]}
      - {frage: "Wie heisst der Hauptort des Bezirks Weinfelden?", antwort: Weinfelden, optionen: [Bürglen, Bischofszell, Sulgen]}
  - id: nachbarkantone
    titel: "2 · Nachbarkantone"
    icon: "🧭"
    uebungen: [auswahl, karteikarte]
    karten:
      - {frage: "Welcher Kanton grenzt im Süden und Osten an den Thurgau?", antwort: St. Gallen, optionen: [Zürich, Schaffhausen, Appenzell]}
      - {frage: "Welcher Kanton grenzt im Westen an den Thurgau?", antwort: Zürich, optionen: [St. Gallen, Aargau, Schaffhausen]}
      - {frage: "Welcher Kanton grenzt im Nordwesten an den Thurgau?", antwort: Schaffhausen, optionen: [Zürich, St. Gallen, Basel]}
      - {frage: "Wie heisst der Hauptort des Kantons Thurgau?", antwort: Frauenfeld, optionen: [Weinfelden, Kreuzlingen, Arbon]}
  - id: flaggen
    titel: "3 · Flaggen der Nachbarländer"
    icon: "🏳️"
    uebungen: [auswahl, paare, karteikarte]
    karten:
      - {frage: "🇨🇭", antwort: Schweiz}
      - {frage: "🇩🇪", antwort: Deutschland}
      - {frage: "🇦🇹", antwort: Österreich}
      - {frage: "🇱🇮", antwort: Liechtenstein}
      - {frage: "🇫🇷", antwort: Frankreich}
      - {frage: "🇮🇹", antwort: Italien}
  - id: nachbarlaender
    titel: "4 · Nachbarländer und Bodensee"
    icon: "⛵"
    uebungen: [auswahl, paare, karteikarte]
    karten:
      - {frage: "Land nördlich des Rheins und des Bodensees", antwort: Deutschland, optionen: [Österreich, Frankreich, Liechtenstein]}
      - {frage: "Land am Ostufer des Bodensees", antwort: Österreich, optionen: [Deutschland, Italien, Liechtenstein]}
      - {frage: "Deutsche Stadt direkt neben Kreuzlingen", antwort: Konstanz, optionen: [Lindau, Friedrichshafen, Singen]}
      - {frage: "Österreichische Stadt am Bodensee", antwort: Bregenz, optionen: [Lindau, Konstanz, Innsbruck]}
      - {frage: "Deutsche Gemüse-Insel im Untersee", antwort: Reichenau, optionen: [Mainau, Lindau, Ufenau]}
      - {frage: "Deutsches Bundesland an der Grenze zum Thurgau", antwort: Baden-Württemberg, optionen: [Bayern, Hessen, Sachsen]}
  - id: gewaesser
    titel: "5 · Gewässer"
    icon: "🌊"
    uebungen: [auswahl, karteikarte]
    karten:
      - {frage: "Welcher Fluss gibt dem Kanton seinen Namen?", antwort: Thur, optionen: [Murg, Sitter, Rhein]}
      - {frage: "Welcher Fluss fliesst durch Frauenfeld?", antwort: Murg, optionen: [Thur, Sitter, Rhein]}
      - {frage: "Welcher Fluss bildet bei Diessenhofen die Grenze zu Deutschland?", antwort: Rhein, optionen: [Thur, Murg, Aare]}
      - {frage: "Welcher grosse See liegt im Norden des Kantons?", antwort: Bodensee, optionen: [Zürichsee, Walensee, Greifensee]}
      - {frage: "Wie heisst der westliche Teil des Bodensees bei Steckborn?", antwort: Untersee, optionen: [Obersee, Überlinger See, Zellersee]}
      - {frage: "Welcher Fluss mündet bei Bischofszell in die Thur?", antwort: Sitter, optionen: [Murg, Lauche, Rhein]}
      - {frage: "In welchen Fluss mündet die Thur?", antwort: Rhein, optionen: [Aare, Limmat, Murg]}
  - id: wappen
    titel: "6 · Wappen und Fahne des Thurgaus"
    icon: "🦁"
    uebungen: [auswahl, karteikarte]
    karten:
      - {frage: "Welche Tiere sind im Thurgauer Wappen?", antwort: zwei Löwen, optionen: [ein Bär, zwei Steinböcke, ein Adler]}
      - {frage: "Welche Farben hat die Thurgauer Fahne?", antwort: Grün und Weiss, optionen: [Rot und Weiss, Blau und Weiss, Gelb und Schwarz]}
      - {frage: "Welche Farbe haben die Löwen im Thurgauer Wappen?", antwort: Gelb, optionen: [Rot, Schwarz, Weiss]}
      - {frage: "Seit wann ist der Thurgau ein eigener Kanton?", antwort: "1803", optionen: ["1291", "1848", "1798"]}
  - id: schloesser
    titel: "7 · Schlösser"
    icon: "🏰"
    uebungen: [auswahl, paare, karteikarte]
