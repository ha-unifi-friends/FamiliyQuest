    titel: "être – sein"
    icon: "✍️"
    uebungen: [lueckentext, auswahl]
    karten:
      - {frage: "être – je", antwort: suis, satz: "Je ___ content.", optionen: [suis, es, est, sommes, êtes, sont]}
      - {frage: "être – tu", antwort: es, satz: "Tu ___ fatigué ?", optionen: [suis, es, est, sommes, êtes, sont]}
      - {frage: "être – il", antwort: est, satz: "Il ___ à la maison.", optionen: [suis, es, est, sommes, êtes, sont]}
      - {frage: "être – elle", antwort: est, satz: "Elle ___ très gentille.", optionen: [suis, es, est, sommes, êtes, sont]}
      - {frage: "être – nous", antwort: sommes, satz: "Nous ___ en classe.", optionen: [suis, es, est, sommes, êtes, sont]}
      - {frage: "être – vous", antwort: êtes, auch: [etes], satz: "Vous ___ suisses ?", optionen: [suis, es, est, sommes, êtes, sont]}
      - {frage: "être – ils", antwort: sont, satz: "Ils ___ dans le jardin.", optionen: [suis, es, est, sommes, êtes, sont]}
      - {frage: "être – elles", antwort: sont, satz: "Elles ___ sœurs.", optionen: [suis, es, est, sommes, êtes, sont]}
