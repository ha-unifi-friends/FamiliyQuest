# Französisch A1 – Sprachkurs (eigene Inhalte, Family Quest, CC0)
id: sprache-fr-a1
titel: "Französisch A1 – Einstieg"
fach: franzoesisch
stufe: "A1"
sprache: fr
quellsprache: de
version: 1
quelle: Family Quest (eigene Inhalte, CC0)
icon: "🇫🇷"
beschreibung: "Erste Schritte auf Französisch: grüssen, zählen, Familie, Essen, Farben und einfache Sätze für den Alltag."
beschreibung_i18n:   # the description in the language of the app (shown in the course list)
  en: "First steps in French: greeting, counting, family, food, colours and simple everyday sentences."
  it: "Primi passi in francese: salutare, contare, famiglia, cibo, colori e frasi semplici di tutti i giorni."
  es: "Primeros pasos en francés: saludar, contar, familia, comida, colores y frases sencillas del día a día."
  nl: "Eerste stappen in het Frans: begroeten, tellen, familie, eten, kleuren en eenvoudige zinnen voor elke dag."
  pl: "Pierwsze kroki we francuskim: powitania, liczenie, rodzina, jedzenie, kolory i proste codzienne zdania."
  pt: "Primeiros passos em francês: cumprimentar, contar, família, comida, cores e frases simples do dia a dia."
  sv: "Första stegen på franska: hälsa, räkna, familj, mat, färger och enkla vardagsmeningar."
pfad: true
standard: false
selbst: true
einheiten:
  - id: begruessung
    titel: Hallo, wer bist du?
    icon: "👋"
    uebungen: [auswahl, eintippen, hoeren, karteikarte]
    karten:
      - {de: Guten Tag, fr: bonjour, emoji: "👋"}
      - {de: Hallo, fr: salut}
      - {de: Auf Wiedersehen, fr: au revoir}
      - {de: Bis bald, fr: à bientôt, auch: [a bientot]}
      - {de: danke, fr: merci, emoji: "🙏"}
      - {de: bitte, fr: s'il te plaît, auch: [s'il te plait, s'il vous plaît, s'il vous plait]}
      - {de: "Wie geht's?", fr: "Ça va ?", auch: ["Ça va?", "Ca va ?", "Ca va?"]}
      - {de: "Es geht mir gut.", fr: "Ça va bien.", auch: ["Ca va bien."]}
      - {de: "Wie heisst du?", fr: "Comment tu t'appelles ?", auch: ["Comment tu t'appelles?", "Tu t'appelles comment ?"]}
      - {de: "Ich heisse Lea.", fr: "Je m'appelle Lea.", auch: ["Je m'appelle Léa."]}
      - {de: "Ich bin zehn Jahre alt.", fr: "J'ai dix ans."}
      - {de: "Ich wohne in der Schweiz.", fr: "J'habite en Suisse."}
