      - {frage: "hacer → Partizip", antwort: "hecho", satz: "¿Qué has ___ hoy?", optionen: ["hecho", "hacido", "haciendo", "hizo"]}
      - {frage: "ver → Partizip", antwort: "visto", satz: "No he ___ la película.", optionen: ["visto", "vido", "viendo", "vio"]}
      - {frage: "escribir → Partizip", antwort: "escrito", satz: "Ella ha ___ una carta.", optionen: ["escrito", "escribido", "escribiendo", "escribió"]}
