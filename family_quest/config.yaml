name: "Family Quest"
version: "0.3.0"
slug: family_quest
description: "Organize your family life with gamification – learning, chores, planner and games"
url: https://github.com/ha-unifi-friends/FamiliyQuest
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:school
panel_title: "Family Quest"
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Direct access for tablets in the home network (only with the option direct_access)"
map:
  - share:rw
  - homeassistant_config:ro
options:
  log_level: info
  direct_access: false
  anthropic_api_key: ""
  anthropic_model: claude-opus-5-5
schema:
  log_level: list(debug|info|warning|error)
  direct_access: bool
  anthropic_api_key: password?
  anthropic_model: str?
