<!doctype html>
<html lang="en" data-version="__VERSION__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>Family Quest – Planer</title>
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="shared/base.css?v=__VERSION__">
<style>
  body { background: #141414; margin: 0; }
  #planer-root { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
  html.fq-in-parent #planer-root { padding-bottom: 0; min-height: 0; }
  html.fq-in-parent body { background: var(--card); }
  /* parent area: no top bar of its own (clock, season, buttons) – its functions are buttons in the section head of
     the parent area (parent.js planerChoresSection); the views sit flush in the section card */
  html.fq-in-parent family-planer-nav-card { display: none !important; }
  html.fq-in-parent family-planer-panel { padding: 0 !important; min-height: 0 !important; background: var(--card) !important; }
  .fq-wait { color: #aaa; padding: 40px; text-align: center; font-family: system-ui, sans-serif; }
</style>
<script src="planer/page-pre.js?v=__VERSION__"></script>
<script src="shared/i18n.js?v=__VERSION__"></script>
</head>
<body>
<div id="planer-root"><div class="fq-wait">…</div></div>
<script src="shared/ui.js?v=__VERSION__"></script>
<script src="planer/fq-pre.js?v=__VERSION__"></script>
<script src="planer/mdi-icons.js?v=__VERSION__"></script>
<script src="planer/family-planer-cards.js?v=__VERSION__"></script>
<script src="planer/host.js?v=__VERSION__"></script>
<script src="planer/page-start.js?v=__VERSION__"></script>
</body>
</html>
